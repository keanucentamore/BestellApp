<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BurgerHouse – Bestell App</title>
    <link rel="icon" href="./assets/images/logo_burger_image.webp" type="image/webp">
    <link rel="stylesheet" href="./assets/css/fonts.css">
    <link rel="stylesheet" href="./assets/css/variables.css">
    <link rel="stylesheet" href="./assets/css/standard.css">
    <link rel="stylesheet" href="style.css">
    <script src="./assets/javascript/db.js"></script>
    <script src="./assets/javascript/templates.js"></script>
    <script src="script.js"></script>
</head>

<body onload="init()">
    <header class="site-header">
        <div class="header-content">
            <img class="app-logo" src="./assets/icons/icons_bestellapp.svg" alt="Bestell App Logo">
            <img class="menu-icon" src="./assets/icons/icons_menu.svg" alt="Menü">
        </div>
    </header>

    <main>
        <section class="hero"></section>

        <section class="restaurant-intro">
            <img class="restaurant-logo" src="./assets/images/logo_burger_image.webp" alt="BurgerHouse Logo">
            <div class="restaurant-head">
                <h1 class="restaurant-name">Burger<span class="restaurant-name-dark">House</span></h1>
                <p class="rating">
                    <img class="rating-star" src="./assets/icons/icons_star.svg" alt="Bewertung">
                    4,1 <span class="rating-count">(317)</span>
                </p>
            </div>
            <p class="restaurant-description">The best of Burgers, Pizza, and Greens, all in one great place.</p>
            <p class="delivery-info">Delivery fee 4,99€ · Delivery time 30–45 min</p>
        </section>

        <div class="menu-layout">
            <div class="menu" id="menu"></div>

            <aside class="basket">
                <h2 class="basket-title">Your Basket</h2>
                <div id="basket-content"></div>
            </aside>
        </div>
    </main>

    <footer class="site-footer">
        <p>© 2025 BurgerHouse</p>
        <nav class="footer-links">
            <a href="#">Imprint</a>
            <a href="#">Cookie Preferences</a>
        </nav>
    </footer>

    <nav class="bottom-nav">
        <a class="nav-item" href="#">
            <img class="nav-icon" src="./assets/icons/home_white_icon.svg" alt="Home">
            <img class="nav-icon-active" src="./assets/icons/home_orange_icon.svg" alt="">
        </a>
        <button class="nav-item">
            <img class="nav-icon" src="./assets/icons/profile_white_icon.svg" alt="Profil">
            <img class="nav-icon-active" src="./assets/icons/profile_orange_icon.svg" alt="">
        </button>
        <button class="nav-item">
            <img class="nav-icon" src="./assets/icons/orders_white_icon.svg" alt="Bestellungen">
            <img class="nav-icon-active" src="./assets/icons/orders_orange_icon.svg" alt="">
        </button>
        <button class="nav-item" onclick="openMobileBasket()">
            <img class="nav-icon" src="./assets/icons/basket_white_icon.svg" alt="Warenkorb">
            <img class="nav-icon-active" src="./assets/icons/basket_orange_icon.svg" alt="">
            <span id="basket-count"></span>
        </button>
    </nav>

    <div id="mobile-basket"></div>
    <div id="order-dialog"></div>
</body>

</html>
